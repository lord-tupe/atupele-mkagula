backend:
  name: git-gateway
  branch: main

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - label: "Site Settings"
    name: "settings"
    files:
      - label: "General & Social"
        name: "site"
        file: "_data/site.yml"
        fields:
          - {label: "Name", name: "name", widget: "string"}
          - {label: "Location", name: "location", widget: "string"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Phone", name: "phone", widget: "string"}
          - {label: "Website", name: "website", widget: "string"}
          - label: "Social Links"
            name: "social"
            widget: "list"
            fields:
              - {label: "Platform", name: "platform", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
              - {label: "Icon Class", name: "icon", widget: "string"}

  - label: "Professional Data"
    name: "professional"
    files:
      - label: "Experience"
        name: "experience"
        file: "_data/experience.yml"
        fields:
          - label: "Jobs"
            name: "items"
            widget: "list"
            fields:
              - {label: "Role", name: "role", widget: "string"}
              - {label: "Company", name: "company", widget: "string"}
              - {label: "Period", name: "period", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Accent Color (Hex)", name: "accent", widget: "string"}
              - {label: "Icon Class", name: "icon", widget: "string"}
              - label: "Tags"
                name: "tags"
                widget: "list"
                field: {label: "Tag", name: "tag", widget: "string"}
      
      - label: "Skills"
        name: "skills"
        file: "_data/skills.yml"
        fields:
          - label: "Skill Categories"
            name: "items"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Accent Color", name: "accent", widget: "string"}
              - {label: "Icon Class", name: "icon", widget: "string"}

      - label: "Education"
        name: "education"
        file: "_data/education.yml"
        fields:
          - label: "Institutions"
            name: "items"
            widget: "list"
            fields:
              - {label: "Institution", name: "institution", widget: "string"}
              - {label: "Campus/Location", name: "campus", widget: "string"}
              - {label: "Degree/Certificate", name: "degree", widget: "string"}
              - {label: "Year", name: "year", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Accent Color", name: "accent", widget: "string"}
              - {label: "Icon Class", name: "icon", widget: "string"}

      - label: "Achievements"
        name: "achievements"
        file: "_data/achievements.yml"
        fields:
          - label: "Wins"
            name: "items"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Category/Date", name: "date", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
